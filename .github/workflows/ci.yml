name: CI Verification Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-verify:
    name: Run Ruff & Pytest Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install project dependencies
        run: |
          uv sync --dev --extra lint

      - name: Run Ruff Lint
        run: |
          uv run ruff check brand_analytics_app backend frontend tests

      - name: Run Pytest Suite (Unit + Integration)
        env:
          GOOGLE_CLOUD_PROJECT: "local-demo-project"
          DATA_BACKEND: "local"
          GOOGLE_GENAI_USE_VERTEXAI: "False"
          INTEGRATION_TEST: "TRUE"
          GEMINI_API_KEY: "mock-api-key"
          GOOGLE_API_KEY: "mock-api-key"
        run: |
          uv run pytest tests/unit/ tests/integration/ -v

  frontend-portal:
    name: Verify Next.js Portal (Typecheck, Test, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-portal

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend-portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm run test

      - name: Build Production Bundle
        run: npm run build
