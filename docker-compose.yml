services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8080"
    environment:
      - PORT=8080
      - DATA_BACKEND=local
      - GOOGLE_GENAI_USE_VERTEXAI=False
      - INTEL_LAKEHOUSE_DIR=/workspace/data/eu_auto_lakehouse
      - VELOCITY_GOLD_DIR=/workspace/data/eu_auto_lakehouse/gold/velocity_artifacts
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://portal:3000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 3

  portal:
    build:
      context: ./frontend-portal
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:8080
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
