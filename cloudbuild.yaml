steps:
  # Build backend
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args: [
      'build',
      '-t', 'europe-west3-docker.pkg.dev/$PROJECT_ID/brand-analytics-repo/backend:latest',
      '-f', 'backend/Dockerfile',
      '.'
    ]

  # Build frontend
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    args: [
      'build',
      '-t', 'europe-west3-docker.pkg.dev/$PROJECT_ID/brand-analytics-repo/frontend:latest',
      '-f', 'frontend/Dockerfile',
      '.'
    ]

images:
  - 'europe-west3-docker.pkg.dev/$PROJECT_ID/brand-analytics-repo/backend:latest'
  - 'europe-west3-docker.pkg.dev/$PROJECT_ID/brand-analytics-repo/frontend:latest'
